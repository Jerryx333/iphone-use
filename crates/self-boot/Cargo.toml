[package]
name = "self-boot"
version = "0.1.0"
edition = "2024"
license = "PolyForm-Shield-1.0.0"
description = "On-device IDE-side testmanagerd bootstrap and USB protocol probe"

[lib]
crate-type = ["staticlib", "rlib"]

[dependencies]
idevice = { version = "=0.1.68", default-features = false, features = ["ring", "remote_pairing", "rsd", "core_device_proxy", "tunnel_tcp_stack", "xctest", "heartbeat", "mobile_image_mounter", "cryptexd", "usbmuxd"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "net", "io-util", "sync"] }
plist = "1.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
clap = { version = "4", features = ["derive"] }

libc = "0.2"
socket2 = { version = "0.6", features = ["all"] }

tracing = "0.1"
ns-keyed-archive = "0.1.5"
base64 = "0.22"
plist-macro = "0.1.6"

sha2 = "0.10.9"
tokio-rustls = { version = "0.26.4", default-features = false, features = ["ring", "tls12"] }
