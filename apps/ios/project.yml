# The full app: the remote app (project.remote.yml) plus local control, a
# packet-tunnel extension that starts the device runner on the phone itself.
# Network extensions need a paid developer team; a free Apple ID cannot sign them.
include: [project.remote.yml]
name: IPhoneUseRemote
targets:
  IPhoneUseRemote:
    dependencies:
      - target: PhoneLocalControlTunnel
    settings:
      base:
        CODE_SIGN_ENTITLEMENTS: IPhoneUseRemote/LocalControl.entitlements
  PhoneLocalControlTunnel:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.4"
    sources:
      - path: LocalControlTunnel
        excludes: [Info.plist, PhoneTunnelProvider.swift]
      - ../../experiments/phone-self-host/Tunnel/PhoneTunnelProvider.swift
      - LocalControlShared
      - path: ../../experiments/phone-self-host/Resources/DeveloperImage
        type: folder
        optional: true
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(IPU_APP_BUNDLE_ID).tunnel
        INFOPLIST_FILE: LocalControlTunnel/Info.plist
        CODE_SIGN_ENTITLEMENTS: IPhoneUseRemote/LocalControl.entitlements
        SWIFT_VERSION: "5.0"
        SWIFT_STRICT_CONCURRENCY: minimal
        APPLICATION_EXTENSION_API_ONLY: YES
        OTHER_LDFLAGS: "$(inherited) $(IPU_HOST_LDFLAGS)"
